[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mamba-lm"
version = "0.1.0"
description = "Mamba-1 language model with Dynamic A and equity return forecasting"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=14.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
mamba-lm = "mamba_lm.cli:main"

[tool.setuptools.packages.find]
include = ["mamba_lm*", "forecast*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
